; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; ── Variante de build sélectionnée AU FLASH ─────────────────────────────────
; Choisis l'environnement dans le menu déroulant PlatformIO (en bas de VS Code)
; ou en CLI : `pio run -e moduleair -t upload` / `pio run -e atmosud -t upload`.
;   [env:moduleair] -> version CLASSIQUE : données envoyées à AirCarto seul
;   [env:atmosud]   -> version ATMOSUD   : AirCarto + AtmoSud + logo AtmoSud
; Un seul code, aucune variable à éditer : la différence est dans -DBUILD_ATMOSUD.
[platformio]
default_envs = moduleair

; Réglages communs aux deux variantes (PlatformIO applique [env] à tous les env:*)
[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
lib_deps =
    4-20ma/ModbusMaster@^2.0.1
    wifwaf/MH-Z19@^1.5.4
    adafruit/Adafruit BME280 Library@^2.2.4
    adafruit/Adafruit Unified Sensor@^1.1.14
    adafruit/Adafruit CCS811 Library@^1.1.3
    adafruit/Adafruit GFX Library@^1.11.11
    2dom/PxMatrix LED MATRIX library@^1.8.2
    h2zero/NimBLE-Arduino@^1.4.3
build_flags =
    -include src/fonts/glcdfont_mod.c
board_build.partitions = min_spiffs.csv
;extra_scripts = post:ota_upload.py

; ── Version CLASSIQUE (AirCarto seul) ───────────────────────────────────────
[env:moduleair]
; rien de plus : comportement par défaut, identique à l'ancienne build esp32dev

; ── Version ATMOSUD (AirCarto + AtmoSud + logo AtmoSud) ──────────────────────
[env:atmosud]
build_flags =
    ${env.build_flags}
    -DBUILD_ATMOSUD
