; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; ── Variante de build sélectionnée AU FLASH ─────────────────────────────────
; Choisis l'environnement dans le menu déroulant PlatformIO (en bas de VS Code)
; ou en CLI : `pio run -e moduleair -t upload`, `pio run -e atmosud_en -t upload`...
; Deux axes, combinés en 4 environnements :
;   AirCarto seul / AirCarto+AtmoSud   ->  -DBUILD_ATMOSUD
;   Langue de PREMIER boot FR / EN     ->  -DDEFAULT_LANG_EN
;     [env:moduleair]     -> CLASSIQUE, FR par défaut
;     [env:moduleair_en]  -> CLASSIQUE, EN par défaut
;     [env:atmosud]       -> ATMOSUD,   FR par défaut
;     [env:atmosud_en]    -> ATMOSUD,   EN par défaut
; La langue n'est qu'un DÉFAUT de premier boot : au tout premier démarrage, ce
; défaut est ÉCRIT en NVS (cf. i18nInit), puis reste changeable depuis l'UI web.
; Comme il est gravé en NVS dès le 1er boot, il SURVIT à l'OTA (NVS jamais touché
; par la mise à jour) — un device flashé "_en" reste donc en anglais après chaque
; MAJ, même si le firmware OTA servi est la build FR classique.
; ATTENTION : reflasher en série n'efface PAS la NVS. Pour qu'un changement de
; variante (_en <-> FR) reprenne sur une carte DÉJÀ démarrée, efface d'abord la
; NVS : `pio run -e <env> -t erase` puis upload (ou choisis la langue dans l'UI).
[platformio]
default_envs = moduleair

; Réglages communs aux deux variantes (PlatformIO applique [env] à tous les env:*)
[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
lib_deps =
    4-20ma/ModbusMaster@^2.0.1
    wifwaf/MH-Z19@^1.5.4
    adafruit/Adafruit BME280 Library@^2.2.4
    adafruit/Adafruit Unified Sensor@^1.1.14
    adafruit/Adafruit CCS811 Library@^1.1.3
    adafruit/Adafruit GFX Library@^1.11.11
    2dom/PxMatrix LED MATRIX library@^1.8.2
    h2zero/NimBLE-Arduino@^1.4.3
build_flags =
    -include src/fonts/glcdfont_mod.c
board_build.partitions = min_spiffs.csv
; extra_scripts = post:ota_upload.py

; ── Version CLASSIQUE (AirCarto, AtmoSud OFF par défaut) — FR ────────────────
[env:moduleair]
; rien de plus : comportement par défaut, identique à l'ancienne build esp32dev.
; NB : le code d'envoi AtmoSud est présent dans CE binaire aussi (cf. config.h /
; data_sender.cpp) ; -DBUILD_ATMOSUD ne fait QUE fixer le défaut de 1er boot.
; Ici AtmoSud est juste OFF par défaut sur une carte neuve, mais reste activable
; via le flag NVS "server/atmosud" — donc une carte déjà flaguée AtmoSud qui
; reçoit ce firmware en OTA continue d'alimenter AtmoSud.

; ── Version CLASSIQUE (AirCarto seul) — EN (anglais par défaut au 1er boot) ──
[env:moduleair_en]
build_flags =
    ${env.build_flags}
    -DDEFAULT_LANG_EN

; ── Version ATMOSUD (AirCarto + AtmoSud + logo AtmoSud) — FR ─────────────────
[env:atmosud]
build_flags =
    ${env.build_flags}
    -DBUILD_ATMOSUD

; ── Version ATMOSUD — EN (anglais par défaut au 1er boot) ────────────────────
[env:atmosud_en]
build_flags =
    ${env.build_flags}
    -DBUILD_ATMOSUD
    -DDEFAULT_LANG_EN

; ── Version L'AIR ET MOI (AirCarto + logo « L'Air et Moi », AtmoSud OFF) — FR ──
; Côté DONNÉES : identique à la build CLASSIQUE — AtmoSud OFF par défaut au 1er
; boot (pas de -DBUILD_ATMOSUD), mais activable via le flag NVS "server/atmosud"
; comme sur toute build (le code AtmoSud est présent dans tous les binaires). En
; PLUS : ajoute un 4e logo « L'Air et Moi » dans la rotation matrice (slot SPIFFS
; dédié, éditable depuis l'UI web). Les
; logos ModuleAir / AirCarto / AtmoSud / L'Air et Moi sont ON par défaut au
; 1er boot (modifiables ensuite dans « Ecrans matrice »).
[env:lairetmoi]
build_flags =
    ${env.build_flags}
    -DBUILD_LAIRETMOI

; ── Version L'AIR ET MOI — EN (anglais par défaut au 1er boot) ────────────────
[env:lairetmoi_en]
build_flags =
    ${env.build_flags}
    -DBUILD_LAIRETMOI
    -DDEFAULT_LANG_EN
