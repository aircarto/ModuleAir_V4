; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; ── Variante de build sélectionnée AU FLASH ─────────────────────────────────
; Choisis l'environnement dans le menu PlatformIO (bas de VS Code) ou en CLI :
;   pio run -e moduleair -t upload
;
; DEUX FAMILLES d'environnements :
;
;  • PRODUCTION / OTA (poussés à toute la flotte, AirCarto seul par défaut) :
;     [env:moduleair]      AirCarto, FR          (défaut ; binaire OTA universel)
;     [env:moduleair_en]   AirCarto, EN
;     [env:lairetmoi]      AirCarto + logo « L'Air et Moi », FR
;     [env:lairetmoi_en]   idem, EN
;
;  • PROVISIONING AtmoSud (flash USB UNIQUEMENT, JAMAIS poussé en OTA) :
;     [env:atmosud_provision]     AtmoSud, FR   ← stampe la NVS : CE capteur
;     [env:atmosud_provision_en]  AtmoSud, EN      enverra à AtmoSud À VIE
;
;  • ATMOSUD VITRINE (flash USB UNIQUEMENT) — logo AtmoSud à l'écran, mais
;    AUCUN envoi MicroSpot : les données partent chez AirCarto SEUL.
;     [env:atmosud_display]       AtmoSud à l'écran, FR, sans envoi MicroSpot
;
;  • GRAND ECRAN P3 (flash USB UNIQUEMENT, ordre couleurs RRGGBB au lieu de
;    RRBBGG ; le défaut P3 est stampé en NVS et survit à l'OTA, cf. plus bas) :
;     [env:moduleair_p3]          AirCarto, FR, dalle P3
;     [env:atmosud_provision_p3]  AtmoSud,  FR, dalle P3
;
;  • CAPTEUR CO2 (MH-Z19 / SenseAir S8-S88) : AUCUN env dédié — le modèle est
;    reconnu automatiquement au runtime, tous les envs ci-dessus marchent avec
;    l'un comme avec l'autre.
;
; La décision « ce capteur envoie aussi à AtmoSud » se prend UNIQUEMENT ici, au
; flash usine (le stamp NVS survit aux OTA et au reset). Le binaire OTA
; `moduleair` ne fait que LIRE ce stamp : on peut le pousser à toute la flotte
; sans risque — seuls les capteurs stampés enverront à AtmoSud.
;
; La langue (-DDEFAULT_LANG_EN) et le logo AtmoSud (-DBUILD_ATMOSUD) ne sont que
; des DÉFAUTS de 1er boot, gravés en NVS puis changeables dans l'UI web ; ils
; survivent à l'OTA. Pour réappliquer un défaut sur une carte déjà démarrée,
; efface d'abord la NVS : `pio run -e <env> -t erase` puis upload.
[platformio]
default_envs = moduleair

; Réglages communs aux deux variantes (PlatformIO applique [env] à tous les env:*)
[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
lib_deps =
    4-20ma/ModbusMaster@^2.0.1
    wifwaf/MH-Z19@^1.5.4
    adafruit/Adafruit BME280 Library@^2.2.4
    adafruit/Adafruit Unified Sensor@^1.1.14
    adafruit/Adafruit CCS811 Library@^1.1.3
    adafruit/Adafruit GFX Library@^1.11.11
    2dom/PxMatrix LED MATRIX library@^1.8.2
    h2zero/NimBLE-Arduino@^1.4.3
    bblanchon/ArduinoJson@^7.1.0
build_flags =
    -include src/fonts/glcdfont_mod.c
board_build.partitions = min_spiffs.csv
; pre:  secrets_inject.py injecte l'URL/token AtmoSud depuis secrets.ini
;       (gitignore, cf. secrets.example.ini). Fichier absent ->
;       envoi AtmoSud compile-out (zero trace de l'URL/token dans le binaire).
; pre:  web_embed.py gzippe web/app.html dans src/web_index.h (SPA servie
;       en PROGMEM sur / quand le module est connecte).
; post: ota_upload.py pousse le firmware sur le serveur OTA (OTA_SKIP=1 pour bypass).
extra_scripts =
    pre:secrets_inject.py
    pre:web_embed.py
    post:ota_upload.py

; ── Version CLASSIQUE (AirCarto, AtmoSud OFF par défaut) — FR ────────────────
[env:moduleair]
; rien de plus : comportement par défaut, identique à l'ancienne build esp32dev.
; NB : la décision d'envoi AtmoSud est PAR CAPTEUR (stamp NVS écrit à l'usine
; par l'env atmosud_provision), plus par variante de build. Une carte stampée
; AtmoSud qui reçoit ce firmware en OTA continue d'alimenter AtmoSud ; une
; carte non stampée ne peut JAMAIS s'activer via OTA (reflash USB requis).

; ── Version CLASSIQUE (AirCarto seul) — EN (anglais par défaut au 1er boot) ──
[env:moduleair_en]
build_flags =
    ${env.build_flags}
    -DDEFAULT_LANG_EN

; ── Provisioning ATMOSUD — FR ────────────────────────────────────────────────
; À flasher en USB UNIQUEMENT sur les capteurs destinés au déploiement AtmoSud.
; Au 1er boot, le firmware stampe la NVS (namespace 'atmosud', clé 'stamped') :
; ce capteur enverra vers AtmoSud A VIE (le stamp survit aux OTA et au reset
; WiFi ; seul un erase_flash l'efface). Les OTA suivants poussent le binaire
; standard `moduleair` qui LIT ce stamp. -DBUILD_ATMOSUD met aussi le logo
; AtmoSud ON par défaut au 1er boot (gravé en NVS, suit donc le capteur).
;
; extra_scripts override : on garde pre:secrets_inject.py mais on RETIRE
; post:ota_upload.py — ce binaire est flash-only, il ne doit JAMAIS être poussé
; en OTA (sinon toute la flotte se ferait stamper AtmoSud au 1er boot post-OTA).
;
; Usage : pio run -e atmosud_provision -t upload
[env:atmosud_provision]
build_flags =
    ${env.build_flags}
    -DBUILD_ATMOSUD
    -DFACTORY_ATMOSUD=1
extra_scripts =
    pre:secrets_inject.py
    pre:web_embed.py

; ── Provisioning ATMOSUD — EN (anglais par défaut au 1er boot) ───────────────
[env:atmosud_provision_en]
build_flags =
    ${env.build_flags}
    -DBUILD_ATMOSUD
    -DFACTORY_ATMOSUD=1
    -DDEFAULT_LANG_EN
extra_scripts =
    pre:secrets_inject.py
    pre:web_embed.py

; ── ATMOSUD VITRINE (logo AtmoSud à l'écran, SANS envoi MicroSpot) — FR ──────
; Même build que [env:moduleair], avec en plus -DBUILD_ATMOSUD SEUL.
;
; Ce que ça donne :
;   • ÉCRAN  : le logo AtmoSud est ON par défaut dans la rotation matrice au
;              1er boot (LOGO_ATMOSUD_DEFAULT, cf. config.h) — décochable dans
;              « Ecrans matrice » comme n'importe quel écran.
;   • DONNÉES: AirCarto SEUL. PAS de -DFACTORY_ATMOSUD=1, donc AUCUN stamp NVS
;              n'est écrit → le capteur n'envoie JAMAIS vers AtmoSud/MicroSpot.
;              C'est toute la différence avec [env:atmosud_provision], qui lui
;              stampe la carte à vie.
;   • CO2    : auto-détection MH-Z19 / SenseAir S8-S88, comme partout ailleurs.
;
; ATTENTION — le stamp AtmoSud est une propriété de LA CARTE (NVS), pas du
; binaire : flasher cet env sur un capteur DÉJÀ provisionné AtmoSud ne le
; dé-stampe PAS, il continuera d'envoyer à MicroSpot. Cet env garantit
; « pas d'envoi » sur une carte NEUVE (ou après `-t erase`) uniquement.
;
; extra_scripts override : on RETIRE post:ota_upload.py — comme les envs P3, ce
; binaire pose un DÉFAUT de 1er boot différent du binaire universel ; le pousser
; en OTA ferait démarrer toute carte neuve de la flotte avec le logo AtmoSud.
;
; Usage : pio run -e atmosud_display -t upload
[env:atmosud_display]
build_flags =
    ${env.build_flags}
    -DBUILD_ATMOSUD
extra_scripts =
    pre:secrets_inject.py
    pre:web_embed.py

; ── Version L'AIR ET MOI (AirCarto + logo « L'Air et Moi ») — FR ─────────────
; Côté DONNÉES : identique à la build CLASSIQUE — AirCarto seul (la décision
; d'envoi AtmoSud reste le stamp NVS posé à l'usine, cf. atmosud_provision). En
; PLUS : ajoute un 4e logo « L'Air et Moi » dans la rotation matrice (slot SPIFFS
; dédié, éditable depuis l'UI web). Les logos ModuleAir / AirCarto / AtmoSud /
; L'Air et Moi sont ON par défaut au 1er boot (modifiables dans « Ecrans matrice »).
[env:lairetmoi]
build_flags =
    ${env.build_flags}
    -DBUILD_LAIRETMOI

; ── Version L'AIR ET MOI — EN (anglais par défaut au 1er boot) ────────────────
[env:lairetmoi_en]
build_flags =
    ${env.build_flags}
    -DBUILD_LAIRETMOI
    -DDEFAULT_LANG_EN

; ── GRAND ECRAN P3 (dalle pas 3mm) ───────────────────────────────────────────
; Les deux envs ci-dessous sont les MEMES builds que [env:moduleair] et
; [env:atmosud_provision], avec en plus -DDEFAULT_PANEL_P3 : l'ordre des couleurs
; de la matrice passe de RRBBGG (P2.5, petit ecran) a RRGGBB (P3, grand ecran).
;
; Le flag ne fait que poser le DEFAUT de 1er boot, grave en NVS (cle
; display/panelP3) puis relu a chaque demarrage. La NVS survivant a l'OTA, un
; capteur P3 flashe une fois avec ces envs garde les bonnes couleurs MEME apres
; avoir recu le binaire OTA universel (qui reste P2.5 par defaut) : ce binaire
; universel LIT le stamp NVS, exactement comme pour la langue / le stamp AtmoSud.
;
; extra_scripts override : on RETIRE post:ota_upload.py — ces binaires sont
; FLASH USB UNIQUEMENT et ne doivent JAMAIS ecraser le binaire OTA universel
; (sinon une carte P2.5 neuve, sans NVS, demarrerait en couleurs P3).
;
; Usage : pio run -e moduleair_p3 -t upload   /   pio run -e atmosud_provision_p3 -t upload

; AirCarto classique — GRAND ECRAN P3
[env:moduleair_p3]
build_flags =
    ${env.build_flags}
    -DDEFAULT_PANEL_P3
extra_scripts =
    pre:secrets_inject.py
    pre:web_embed.py

; Provisioning ATMOSUD — GRAND ECRAN P3 (flash USB usine, jamais OTA)
[env:atmosud_provision_p3]
build_flags =
    ${env.build_flags}
    -DBUILD_ATMOSUD
    -DFACTORY_ATMOSUD=1
    -DDEFAULT_PANEL_P3
extra_scripts =
    pre:secrets_inject.py
    pre:web_embed.py

; ── CAPTEUR CO2 : AUCUN ENV DEDIE ────────────────────────────────────────────
; MH-Z19 et SenseAir S8/S88 partagent le meme connecteur UART et sont detectes
; AUTOMATIQUEMENT au premier cycle de lecture (cf. readCO2 dans sensors.cpp).
; Il n'y a donc rien a choisir a la compilation : tous les envs ci-dessus
; fonctionnent avec l'un comme avec l'autre, y compris le binaire OTA universel.
; (Les anciens envs moduleair_s8 / atmosud_provision_s8 ont ete supprimes en
; 0.6.0 — ils forcaient le protocole via -DDEFAULT_CO2_S88.)
