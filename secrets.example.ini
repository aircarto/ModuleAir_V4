; Template de secrets compile-time. Copie ce fichier en `secrets.ini`
; (gitignore) et remplace le token.
;
; Le script `secrets_inject.py` (PIO pre-build) lit `secrets.ini`, injecte
; l'URL en build_flag (-DATMOSUD_SERVER_URL) et le firmware l'utilise pour
; l'envoi secondaire AtmoSud (MicroSpot).
;
; Si le fichier est absent ou si url contient REPLACE_ME, l'envoi AtmoSud
; est compile-out completement : zero trace de l'URL/token dans le binaire.
;
; L'ACTIVATION par capteur ne se decide PAS ici : seul le flash usine de l'env
; `atmosud_provision` (stamp NVS write-once) rend un capteur "AtmoSud".
; Ce fichier ne fournit que la destination (ou envoyer), pas le qui.

[atmosud]
url = https://api-prod.uspot.probesys.net/moduleair?token=REPLACE_ME
